# Runs ruff and mypy before each commit. `uv run pre-commit install` to wire it.
# Hooks use uv (language: system) so they share the project's pinned tools and
# mypy sees PySpark's types.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint, autofix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (static types)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
