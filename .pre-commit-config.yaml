# Pre-commit: run the SAME checks as CI, automatically, before each commit.
#
#   uv run pre-commit install         # one-time: wire the git hook
#   git commit ...                    # hooks now run on the staged files
#   uv run pre-commit run --all-files # run them by hand over the whole repo
#
# These hooks reuse THIS project's environment via `uv run` (language: system),
# so ruff is the version pinned in the dev group and mypy sees PySpark's types.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint, autofix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (static types)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        # Type-check the whole `src/` tree (matching [tool.mypy] files=["src"]),
        # not just the changed filenames — so mypy always sees the full package.
        pass_filenames: false
