# Fires on a version tag (git tag v0.2.0 && git push --tags). Builds the wheel +
# sdist once and uploads them, so the same artifact is what any environment gets.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Upload dist/ as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonicwave-ingest-dist
          path: dist/

  # Deploy is a deliberate placeholder: the target (package feed, compute
  # platform, container) is environment-specific and out of scope here.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the built artifact
        uses: actions/download-artifact@v4
        with:
          name: sonicwave-ingest-dist
          path: dist/

      - name: Deploy (placeholder)
        run: |
          echo "Would publish the wheel in dist/ to the target environment."
          ls -l dist/
