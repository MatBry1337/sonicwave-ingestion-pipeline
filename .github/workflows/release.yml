# =============================================================================
# Release — the "CD" half: build the artifact once, then promote it
# =============================================================================
# Fires on a version tag (e.g. `git tag v0.2.0 && git push --tags`), builds the
# wheel + sdist ONCE, and uploads them. BUILD ONCE, PROMOTE THE SAME ARTIFACT —
# the exact wheel that passed CI is the wheel that reaches every environment.
# =============================================================================

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Upload dist/ as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonicwave-ingest-dist
          path: dist/

  # -------------------------------------------------------------------------
  # deploy: intentionally a STUB. What "deploy" means is environment-specific
  # (a package feed, a Databricks job in Module 3, a container image) and
  # belongs to a later module. Build for real; stub only the last hop.
  # -------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the built artifact
        uses: actions/download-artifact@v4
        with:
          name: sonicwave-ingest-dist
          path: dist/

      - name: Deploy (placeholder)
        run: |
          echo "Would publish the wheel in dist/ to the target environment."
          echo "The HOW is tooling-specific; the WHAT — promote the same"
          echo "already-built, already-tested artifact — is not."
          ls -l dist/
