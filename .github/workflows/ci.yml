# =============================================================================
# CI — the quality gate that runs on every pull request (and every push to main)
# =============================================================================
# Nothing more than the checks you run by hand, executed on a clean machine
# before any change can merge:  lint -> format -> type-check -> test.
# The package lives at the REPOSITORY ROOT, so no working-directory override.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when you push again to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # PySpark runs on the JVM — the runner needs a JDK, like your laptop does.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Reproduce the local environment on the runner (installs the dev group).
      - name: Install dependencies
        run: uv sync

      # The gate, cheapest check first; the Spark test suite runs last.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest -q
